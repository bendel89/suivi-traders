<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi Traders Binance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:#0a0e1a;color:#e8ecf8;min-height:100vh;padding:1rem 1rem 4rem;font-size:15px;line-height:1.5;max-width:900px;margin:0 auto}
h1{text-align:center;font-size:1.4rem;margin-bottom:0.3rem;background:linear-gradient(135deg,#4a9eff,#7c5cff,#d94aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;font-size:0.78rem;color:#8892b0;margin-bottom:1rem}
.filters{display:flex;gap:0.3rem;margin-bottom:1rem;overflow-x:auto;padding-bottom:0.3rem}
.filters button{flex-shrink:0;padding:0.6rem 0.9rem;border-radius:20px;border:1px solid #2a3350;background:#131829;color:#8892b0;font-family:inherit;font-size:0.75rem;font-weight:600;cursor:pointer;white-space:nowrap}
.filters button.active{background:linear-gradient(135deg,#4a9eff,#7c5cff);color:#fff;border-color:transparent}
.panel{background:#131829;border:1px solid #2a3350;border-radius:12px;padding:0.8rem;margin-bottom:1rem}
.trader{display:flex;justify-content:space-between;align-items:center;padding:0.85rem 0.5rem;border-bottom:1px solid #1f2740;gap:0.6rem}
.trader:last-child{border-bottom:none}
.trader-left{flex:1;min-width:0}
.trader-rank{font-size:0.65rem;color:#4a5578;font-weight:600}
.trader-name{font-weight:600;font-size:0.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:0.1rem}
.trader-stats{font-size:0.68rem;color:#8892b0;margin-top:0.25rem;line-height:1.4}
.trader-right{text-align:right;flex-shrink:0}
.roi{font-size:1.05rem;font-weight:700;color:#6ee7a3;font-family:ui-monospace,monospace}
.roi.negative{color:#e07070}
.pnl{font-size:0.68rem;color:#8892b0;margin-top:0.15rem}
.loading{text-align:center;color:#8892b0;padding:2rem;font-size:0.85rem}
.error{color:#e07070;text-align:center;padding:1rem;font-size:0.85rem}
.spinner{width:16px;height:16px;border:2px solid rgba(74,158,255,0.3);border-top-color:#4a9eff;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;vertical-align:middle;margin-right:0.5rem}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:0.7rem;color:#4a5578;text-align:center;margin-top:1rem;line-height:1.5;padding:0.8rem}
</style>
</head>
<body>

<h1>🏆 Top Traders Binance</h1>
<p class="sub">Classement public — analyse leurs performances</p>

<div class="filters" id="filters">
<button class="active" data-stat="ROI" data-period="WEEKLY">ROI · Semaine</button>
<button data-stat="ROI" data-period="MONTHLY">ROI · Mois</button>
<button data-stat="PNL" data-period="WEEKLY">P&L · Semaine</button>
<button data-stat="PNL" data-period="MONTHLY">P&L · Mois</button>
</div>

<div class="panel" id="list">
<div class="loading"><span class="spinner"></span>Chargement des traders…</div>
</div>

<p class="note">
⚠️ Données publiques Binance · Pas de conseil financier<br>
Le copy-trading automatique nécessite une clé API privée + un serveur sécurisé.<br>
Utilise ces données pour <strong>analyser</strong> les stratégies.
</p>

<script>
var currentStat='ROI';
var currentPeriod='WEEKLY';

function charger(){
var list=document.getElementById('list');
list.innerHTML='<div class="loading"><span class="spinner"></span>Chargement…</div>';

fetch('https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.binance.com/bapi/futures/v1/public/future/leaderboard/getLeaderboardRank'),{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
tradeType:'PERPETUAL',
statisticsType:currentStat,
periodType:currentPeriod,
isShared:true,
isTrader:false
})
})
.then(function(r){return r.json();})
.then(function(data){
if(!data.data||!data.data.length){
list.innerHTML='<div class="error">Aucun trader trouvé pour ces critères</div>';
return;
}
var html='';
data.data.slice(0,30).forEach(function(t,idx){
var roi=parseFloat(t.roi||0);
var pnl=parseFloat(t.pnl||0);
var cls=roi>=0?'roi':'roi negative';
var sign=roi>=0?'+':'';
html+='<div class="trader">'+
'<div class="trader-left">'+
'<div class="trader-rank">#'+(idx+1)+'</div>'+
'<div class="trader-name">'+t.nickName+'</div>'+
'<div class="trader-stats">Drawdown max: '+parseFloat(t.maxDrawdown||0).toFixed(1)+'% · Trades: '+(t.tradeCount||0)+'</div>'+
'</div>'+
'<div class="trader-right">'+
'<div class="'+cls+'">'+sign+roi.toFixed(1)+'%</div>'+
'<div class="pnl">'+sign+pnl.toFixed(0)+' USDT</div>'+
'</div>'+
'</div>';
});
list.innerHTML=html;
})
.catch(function(e){
list.innerHTML='<div class="error">Erreur de chargement : '+e.message+'<br><br>Vérifie que tu es connecté à Internet</div>';
});
}

document.querySelectorAll('#filters button').forEach(function(btn){
btn.addEventListener('click',function(){
document.querySelectorAll('#filters button').forEach(function(b){b.classList.remove('active');});
btn.classList.add('active');
currentStat=btn.dataset.stat;
currentPeriod=btn.dataset.period;
charger();
});
});

charger();
</script>
</body>
</html>
